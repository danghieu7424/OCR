[workspace]
members = [
    "crates/ocr_shared",
    "crates/ocr_subtitles",
    "crates/ocr_captions",
    "crates/ocr_merge",
    "crates/talknet_asd",
    "crates/light_asd",
    "crates/caption_ner",
]
# FerriteDB có workspace riêng, chỉ dùng như path dependency.
exclude = ["libs/FerriteDB"]

[package]
name = "ocr-core"
version = "0.7.2"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
name = "ocr"
path = "src/lib.rs"

[[bin]]
name = "ocr-core"
path = "src/main.rs"

[[bin]]
name = "ocr-cli"
path = "src/bin/ocr-cli.rs"

[[example]]
name = "extract_subtitles"
path = "examples/extract_subtitles.rs"

[[example]]
name = "extract_captions"
path = "examples/extract_captions.rs"

[[example]]
name = "merge_subtitles_captions"
path = "examples/merge_subtitles_captions.rs"

[dependencies]
ocr_subtitles = { path = "crates/ocr_subtitles" }
ocr_captions = { path = "crates/ocr_captions" }
ocr_merge = { path = "crates/ocr_merge" }
ocr_shared = { path = "crates/ocr_shared" }
light_asd = { path = "crates/light_asd" }
caption_ner = { path = "crates/caption_ner" }

anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cli_gui_form = { path = "./cli_gui_form" }
ratatui = "0.28"
image = "0.25"

# ort 2.0.0-rc.12 dính deadlock OnceLock ở nhánh `load-dynamic` (pykeio/ort
# #560, #579, #604) làm `Session::builder()` treo vĩnh viễn. Bản sửa (17ed727,
# 8c59e43) chỉ có trên main, chưa phát hành — ghim commit cho tới rc.13.
[patch.crates-io]
ort = { git = "https://github.com/pykeio/ort", rev = "8c59e43826c5e24b0798941f832d11abb398142d" }
ort-sys = { git = "https://github.com/pykeio/ort", rev = "8c59e43826c5e24b0798941f832d11abb398142d" }


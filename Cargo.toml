[workspace]
members = [
    ".",
    "crates/ocr_shared",
    "crates/OCR_Subtitles",
    "crates/OCR_Captions",
    "crates/OCR_LLM",
    "crates/OCR_Merge",
]

[package]
name = "OCR"
version = "0.5.0"
edition = "2024"

[lib]
name = "OCR"
path = "src/lib.rs"

[[bin]]
name = "OCR"
path = "src/main.rs"

[[example]]
name = "extract_subtitles"
path = "examples/extract_subtitles.rs"

[[example]]
name = "extract_captions"
path = "examples/extract_captions.rs"

[[example]]
name = "proofread_subtitles"
path = "examples/proofread_subtitles.rs"

[[example]]
name = "merge_subtitles_captions"
path = "examples/merge_subtitles_captions.rs"

[dependencies]
OCR_Subtitles = { path = "crates/OCR_Subtitles" }
OCR_Captions = { path = "crates/OCR_Captions" }
OCR_LLM = { path = "crates/OCR_LLM" }
OCR_Merge = { path = "crates/OCR_Merge" }
ocr_shared = { path = "crates/ocr_shared" }

anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cli_gui_form = { path = "./cli_gui_form" }
ratatui = "0.28"

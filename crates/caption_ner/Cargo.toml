[package]
name = "caption_ner"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
kreuzberg-gliner-rs = { version = "0.2.1", features = ["load-dynamic"] }
kreuzberg-orp = { version = "0.1.2", features = ["load-dynamic"] }
ureq = { version = "2.12", features = ["tls"] }
indicatif = "0.17"

[[example]]
name = "download_gliner"
path = "examples/download_gliner.rs"

[[example]]
name = "test_gliner_live"
path = "examples/test_gliner_live.rs"
